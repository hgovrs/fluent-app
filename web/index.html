<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aprenda idiomas com pequenas conquistas, no seu ritmo.">
  <meta name="theme-color" content="#0D0D0D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fluent">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="assets/assets/fonts/santech-regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="theme.css">
  <title>Fluent — seu próximo idioma</title>
</head>
<body>
  <div class="loading" id="loading" role="status">
    <span class="loading-spinner" aria-hidden="true"></span>
    <span>Preparando sua próxima conquista…</span>
  </div>
  <noscript>Ative o JavaScript para estudar com o Fluent.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('loading')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
