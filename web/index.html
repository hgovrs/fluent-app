<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aprenda idiomas com pequenas conquistas, no seu ritmo.">
  <meta name="theme-color" content="#287A56">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fluent">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Fluent — seu próximo idioma</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #F8F9F4; }
    .loading { font: 16px system-ui, sans-serif; color: #287A56;
      position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  </style>
</head>
<body>
  <div class="loading" id="loading" role="status">Preparando sua próxima conquista…</div>
  <noscript>Ative o JavaScript para estudar com o Fluent.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('loading')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
